<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM CRUD</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        label {
            font-size: 1rem;
            margin-bottom: 10px;
        }

        input[type="text"] {
            padding: 10px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-bottom: 10px;
            width: 300px;
        }

        button {
            padding: 10px 20px;
            font-size: 1rem;
            border: none;
            border-radius: 5px;
            background-color: #007BFF;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #0056b3;
        }

        .appendElementHere {
            margin-top: 20px;
            width: 300px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .appendElementHere p {
            padding: 10px;
            margin: 5px 0;
            background-color: #ffffff;
            border: 1px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            text-align: left;
            transition: background-color 0.3s ease;
        }

        .appendElementHere p:hover {
            background-color: #f0f0f0;
        }
    </style>
</head>

<body>
    <h1>Add & Remove Element</h1>
    <label>Enter text:</label>
    <input type="text" id="input-field">
    <button id="btn">Add Element</button>
    <div class="appendElementHere"></div>

    <script>
        let inputField = document.getElementById("input-field");
        let submitButton = document.getElementById("btn");
        let appendElementHere = document.querySelector(".appendElementHere");

        submitButton.addEventListener('click', () => {
            addELement();
        });

        inputField.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                addELement();  
            }
        });

        const addELement = () => {
            let createElement = document.createElement('p');
            appendElementHere.appendChild(createElement);
            createElement.innerText = inputField.value;
            inputField.value = '';
        }

        appendElementHere.addEventListener('click', (e) => {
            e.target.remove();
        });
    </script>
</body>

</html>
